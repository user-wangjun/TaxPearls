  "policies": [
    {
      "id": "GD-DEED-BASE",
      "name": "广东契税基本税率及征收征用后重新承受优惠",
      "tax": "契税",
      "document_number": "第86号公告",
      "effective_from": "2021-09-01",
      "effective_to": null,
      "source_ids": [
        "gd-deed",
        "gd-revision"
      ],
      "parameters": [
        {
          "name": "基本税率",
          "value": "0.03",
          "unit": "小数比率",
          "source_id": "gd-deed",
          "clause": "决定第一项，公报第49页",
          "evidence_text": "我省契税适用税率为百分之三"
        }
      ],
      "conditions": [
        "土地、房屋权属所涉计税事项在广东省；核实承受方与权属转移类型",
        "先核对国家规定的减免，再使用地方基本税率",
        "征收/征用后重新承受优惠须有县级以上人民政府征收/征用及补偿资料"
      ],
      "exclusions": [
        "不得给个人住房优惠或法定免税事项一律套3%",
        "未核对国家契税计税依据和特殊优惠时，不将合同总价直接乘3%",
        "因不可抗力住房灭失按面积判断的部分未整理成金额公式"
      ],
      "policy_level": "provincial",
      "applicable_regions": [
        "广东省"
      ]
    },
