- id: VAT-REDUCED-2026
  name: 2026—2027小规模纳税人3%征收率减按1%政策
  tax: 增值税
  region_scope: 全国规定在广东适用
  issuer: 财政部、国家税务总局
  document_number: 2026年第10号；国家税务总局2026年第4号
  document_date: '2026-01-30'
  effective_from: '2026-01-01'
  effective_to: '2027-12-31'
  source_ids:
  - vat-2026
  - vat-administration
  - vat-law
  parameters:
  - name: 规定征收率
    value: '0.03'
    unit: 小数比率
    source_id: vat-2026
    clause: 第三条第（三）部分第6点
    evidence_text: 依照3%征收率减按1%征收率
  - name: 优惠征收率
    value: '0.01'
    unit: 小数比率
    source_id: vat-2026
    clause: 第三条第（三）部分第6点
    evidence_text: 减按1%征收率征收增值税
  conditions:
  - 小规模纳税人发生适用所采条款的增值税应税交易
  - 先核对免税及起征点，再核对减税；确认未放弃减税
  - 核对该交易是否有其他专项简易计税规定，不能只看小规模身份
  exclusions:
  - 明确不含销售/出租不动产和转让土地使用权
  - 自己使用过的固定资产、旧货等同文件另列情形须单独判断，不能全业务统一乘1%
  - 预缴地预收款与最终申报应税销售额不能混为同一个输入
  calculation_notes:
  - 符合本条减税条件的基本税额 = 已确认不含税应税销售额 × 0.01
  - 含税换算、差额计税、预缴抵减及最终申报另按项目规则核对，不在本次自动实现
  - 该1%是征收率，不是地区行业实际税负预警值
  needed_inputs:
  - 小规模身份
  - 业务类型及其他专项情形
  - 纳税期间
  - 不含税销售额
  - 减免选择和发票
  - 预缴抵减记录
  version_notes:
  - 用2026年新衔接公告作为2026依据，不因旧2023年第19号原标到2027就继续套用
  policy_level: national
  applicable_regions:
  - 全国
