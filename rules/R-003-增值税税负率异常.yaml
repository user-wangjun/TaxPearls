id: R-003
name: 增值税税负率异常
category: 指标偏离
tax_type: 增值税
severity: medium
description: >
  本期增值税税负率（应纳税额 ÷ 销售额）落在所属行业参考区间之外，
  偏低时可能存在少计销项、多抵进项或适用税率错误。
logic:
  type: ratio_range
  numerator: 增值税.应纳税额
  denominator: 增值税.销售额
  min: 0.010
  max: 0.045
evidence:
  - 增值税.应纳税额
  - 增值税.销售额
legal_basis:
  - 《中华人民共和国增值税法》第八条
  - 《中华人民共和国税收征收管理法》第三十五条
suggestion: >
  结合行业税负率参考值复核销项与进项的完整性，重点检查进项税额抵扣凭证的合规性
  与应税项目税率适用是否正确。
note: >
  本规则中的区间为「批发和零售业」示意值，正式使用前须按当地税务机关公布的
  行业预警值或企业实际经营情况校准。
