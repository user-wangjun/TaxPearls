    - page: 2
      text: "广东省人民政府规章\r\nX\r\n广东省人民政府发布\r\n- 2 -\r\n人或者使用人，统称为纳税义务人（以下简称纳税人）。\r\n第四条 房产税依照房产原值一次减除30%后的余值计算缴\r\n\
        纳。\r\n房产原值是指纳税人按照财务会计制度规定，在帐簿记载的\r\n房产原值。对纳税人未按财务会计制度规定记载，房产原值不实\r\n和没有原值的房产，由房产所在地税务机关参考同时期的同类房\r\n产核定。\r\
        \n房产出租的，以房产租金收入为房产税的计税依据。\r\n第五条 房产税的税率，依照房产余值计算缴纳的，税率为\r\n1.2%；依照房产租金收入计算缴纳的，税率为 12%。\r\n第六条 下列房产免征房产税：\r\
        \n一、国家机关、人民团体、军队自用的房产；\r\n二、由国家财政部门拨付事业经费的单位自用的房产；\r\n三、宗教寺庙、公园、名胜古迹自用的房产；\r\n四、社会举办的学校、图书馆（室）、文化馆（室）、体育\r\
        \n馆、医院、幼儿园、托儿所、敬老院等公共、公益事业单位自用\r\n的房产；\r\n五、个人自有自用的非营业用的房产；\r\n六、经有关部门核定属危房、不准使用的房产；"
    - page: 3
      text: "广东省人民政府规章\r\nX\r\n广东省人民政府发布\r\n- 3 -\r\n七、经财政部和省税务局批准免税的其他房产。\r\n第七条 对少数民族地区、山区和其他地区部分新建立的建\r\n制镇，由于经济不发达，房屋简陋，县人民政府要求缓征的，可\r\
        \n由县税务局上报，经省税务局批准，可暂缓征收房产税。\r\n第八条 除本细则第六条规定者外，纳税人纳税确有困难，\r\n可向房产所在地纳税人税务机关申请，经县（市）税务局批准，\r\n酌情给予定期减税或免税的照顾。\r\
        \n第九条 房产税按年征收，分期缴纳。具体的缴纳期限，由\r\n市、县税务局规定。\r\n第十条 纳税人变更地址，新建或购买房产，产权转移，房\r\n屋添建，改建增减原值，免税房产出租或营业，应于房产税纳税\r\
        \n期限前向所在地税务机关申报。\r\n第十一条 房产税的征收管理，除本细则第十条规定者外，\r\n依照《中华人民共和国税收征收管理法》及《中华人民共和国税\r\n收征收管理法实施细则》的规定办理。\r\n\
        第十二条 房产税由房产所在地的税务机关征收。\r\n第十三条 本细则由广东省税务局负责解释。\r\n第十四条 本细则自一九八七年一月一日起施行。"
