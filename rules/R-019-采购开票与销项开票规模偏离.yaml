id: R-019
version: '2.0'
name: 采购开票与销项开票规模偏离
category: 外部交叉
tax_type: 增值税
severity: medium
description: 采购开票与销项开票规模偏离；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 仅对采购销售节奏可比的商贸主体作粗筛；销售净额为正，采购包含未售库存、资本性支出等时必须另作解释。
inputs:
  发票.采购不含税净额: 发票对应原始报表/明细台账—采购不含税净额；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  发票.销项净额: 发票对应原始报表/明细台账—销项净额；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
logic:
  type: ratio_range
  numerator: 发票.采购不含税净额
  denominator: 发票.销项净额
  min: 0.3
  max: 1.5
evidence:
- 发票.采购不含税净额
- 发票.销项净额
threshold_basis: 采购/销售比0.3—1.5是教学示意区间，不是法定阈值或行业标准。
legal_basis:
- 《中华人民共和国税收征收管理法》第二十五条：如实申报义务；差异本身不能认定少缴税。
references:
- https://12366.chinatax.gov.cn/bzds/120/120-1-4.html
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
