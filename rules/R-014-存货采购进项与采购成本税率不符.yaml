id: R-014
version: '2.0'
name: 存货采购进项与采购成本税率不符
category: 内部勾稽
tax_type: 增值税
severity: medium
description: 存货采购进项与采购成本税率不符；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 仅限同一期已确认可抵扣的存货采购子集；加权税率按该子集分税率不含税金额加权，剔除不得抵扣及非存货采购，不假设全部成本都带13%进项。
inputs:
  存货.采购可抵扣进项: 存货对应原始报表/明细台账—采购可抵扣进项；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  存货.可抵扣采购不含税金额: 存货对应原始报表/明细台账—可抵扣采购不含税金额；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  存货.采购加权税率: 同一可抵扣存货采购子集按分税率不含税金额加权的税率小数；附分税率明细底稿。
logic:
  type: amount_mismatch
  left: 存货.采购可抵扣进项
  right:
    mul:
    - 存货.可抵扣采购不含税金额
    - 存货.采购加权税率
  tolerance: 100
  direction: absolute
evidence:
- 存货.采购可抵扣进项
- 存货.可抵扣采购不含税金额
- 存货.采购加权税率
threshold_basis: 金额差额容差100元为本项目示意核对参数，不是税法规定的重要性标准；等于容差不命中。
legal_basis:
- 《中华人民共和国增值税法》第十四条、第十六条、第二十一条、第二十八条：一般计税、进项抵扣和纳税义务时间；适用于2026年起。
- 《中华人民共和国会计法》（2024年）第九条、第二十条：核算及报表编制义务；不规定本规则数值阈值。
references:
- https://fgk.chinatax.gov.cn/zcfgk/c100009/c5237365/content.html
- https://kjs.mof.gov.cn/zt/kjfxcgc/kjfqw/202408/t20240814_3941788.htm
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
