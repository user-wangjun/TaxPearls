<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考证内容管理 · 税海拾珠</title>
<style>
  :root { --line: rgba(0,0,0,.15); --muted: #666; --accent: #0f6e56; --danger: #a32d2d; --warn-bg: #faeeda; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
         background: #f5f6f4; color: #222; line-height: 1.6; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 20px;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; }
  main { max-width: 920px; margin: 0 auto; padding: 20px 16px 64px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px;
          padding: 18px 20px; margin-bottom: 18px; }
  h2 { font-size: 15px; font-weight: 500; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
                  border-radius: 8px; font-size: 14px; background: #fff; font-family: inherit; }
  textarea { resize: vertical; min-height: 52px; }
  button { padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px;
           background: #fff; font-size: 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.small { padding: 4px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 130px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .toolbar select { flex: 1; min-width: 260px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
           font-size: 12px; background: #e1f5ee; color: #0f6e56; }
  .badge.gray { background: #eee; color: #555; }
  .badge.warn { background: var(--warn-bg); color: #854f0b; }
  .badge.bad { background: #fcebeb; color: var(--danger); }
  .muted { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px;
          padding: 1px 10px; font-size: 12px; margin-right: 6px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .inline-form { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
  .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .ok { color: var(--accent); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .mark { font-size: 13px; border-left: 3px solid #9fe1cb; padding-left: 8px; margin: 6px 0; }
  .kp-children { margin-left: 22px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>税海拾珠 · 考证内容管理</h1>
  <div id="who" class="muted"></div>
</header>
<main>
  <section id="login-view" class="card" style="max-width:420px;margin:40px auto;">
    <h2>教师 / 管理员登录</h2>
    <label for="username">用户名</label>
    <input id="username" autocomplete="username">
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password">
    <label style="display:flex;align-items:center;gap:6px;margin-top:12px;">
      <input type="checkbox" id="remember" style="width:auto;"> 保持登录 30 天
    </label>
    <div class="row" style="margin-top:14px;">
      <button class="primary" id="login-btn" style="flex:1;">登录</button>
    </div>
    <div class="error" id="login-error"></div>
  </section>

  <section id="app-view" hidden>
    <div class="toolbar">
      <select id="cert-select"></select>
      <button class="primary" id="new-cert-btn">＋ 新建证书</button>
    </div>

    <div id="new-cert-form" class="card" hidden>
      <h2>新建证书</h2>
      <div class="row">
        <div><label>证书编码（唯一）</label><input id="nc-code" placeholder="如 cjkj"></div>
        <div><label>证书名称</label><input id="nc-name" placeholder="如 初级会计职称"></div>
      </div>
      <label>科目清单（逗号分隔）</label>
      <input id="nc-subjects" placeholder="初级会计实务, 经济法基础">
      <label>说明（报考条件、考试形式等）</label>
      <textarea id="nc-description"></textarea>
      <label>内容依据</label>
      <input id="nc-source" placeholder="如：人社部考试公告">
      <div class="actions">
        <button class="primary" data-act="create-cert">创建并上架</button>
        <button data-act="cancel-new-cert">取消</button>
      </div>
    </div>

    <div class="card">
      <h2>证书信息 <span id="cert-state"></span></h2>
      <div id="cert-form" hidden>
        <div class="row">
          <div><label>证书名称</label><input id="cf-name"></div>
          <div><label>编码</label><input id="cf-code" disabled></div>
        </div>
        <label>科目清单（逗号分隔）</label>
        <input id="cf-subjects">
        <label>说明</label>
        <textarea id="cf-description"></textarea>
        <label>内容依据</label>
        <input id="cf-source">
        <div class="actions">
          <button class="primary small" data-act="save-cert">保存修改</button>
          <button class="small" data-act="toggle-active"></button>
        </div>
      </div>
      <p class="muted" id="cert-empty" hidden>请先选择或新建证书。</p>
    </div>

    <div class="card">
      <h2>考试日期 <button class="small" data-act="show-date-form">＋ 录入日期</button></h2>
      <div id="date-form" class="inline-form" hidden>
        <div class="row">
          <div><label>类型</label>
            <select id="df-type"><option value="official">官方考试日</option><option value="expected">预计考试日</option></select></div>
          <div><label>日期</label><input id="df-date" type="date"></div>
          <div><label>批次标识（选填）</label><input id="df-label" placeholder="如 2027年第一批"></div>
        </div>
        <div class="actions"><button class="primary small" data-act="create-date">录入</button></div>
      </div>
      <div id="dates"></div>
    </div>

    <div class="card">
      <h2>考纲知识点 <button class="small" data-act="show-kp-form">＋ 新增知识点</button></h2>
      <div id="kp-form" class="inline-form" hidden>
        <div class="row">
          <div><label>编码（证书内唯一）</label><input id="kf-code" placeholder="如 KP-01"></div>
          <div><label>名称</label><input id="kf-name"></div>
          <div><label>科目</label><input id="kf-subject"></div>
          <div><label>上级知识点</label><select id="kf-parent"></select></div>
        </div>
        <div class="row">
          <div><label>考纲依据（章节/条目）</label><input id="kf-source" placeholder="如 考纲第三章第2节"></div>
          <div><label>考纲版本</label><input id="kf-version" placeholder="如 2027版"></div>
        </div>
        <div class="actions"><button class="primary small" data-act="create-kp">创建</button></div>
      </div>
      <div id="kps"></div>
    </div>
    <div class="error" id="app-error"></div>
  </section>
</main>
<script src="/training-staff.js"></script>
</body>
</html>
