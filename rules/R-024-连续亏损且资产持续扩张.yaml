id: R-024
version: '2.0'
name: 连续亏损且资产持续扩张
category: 指标偏离
tax_type: 综合
severity: medium
description: 连续亏损且资产持续扩张；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 三个连续完整会计年度净利润均小于0且最近两年资产同比各增长超过20%；资产基数为正，合并范围一致。仅作经营与税务复核线索。
inputs:
  年度.本年净利润: 年度对应原始报表/明细台账—本年净利润；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。历史实际起止日期写入口径说明，必须满足规则要求的连续/同期期间。
  年度.上年净利润: 年度对应原始报表/明细台账—上年净利润；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。历史实际起止日期写入口径说明，必须满足规则要求的连续/同期期间。
  年度.前年净利润: 年度对应原始报表/明细台账—前年净利润；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。历史实际起止日期写入口径说明，必须满足规则要求的连续/同期期间。
  年度.本年末资产: 年度对应原始报表/明细台账—本年末资产；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。历史实际起止日期写入口径说明，必须满足规则要求的连续/同期期间。
  年度.上年末资产: 年度对应原始报表/明细台账—上年末资产；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。历史实际起止日期写入口径说明，必须满足规则要求的连续/同期期间。
  年度.前年末资产: 年度对应原始报表/明细台账—前年末资产；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。历史实际起止日期写入口径说明，必须满足规则要求的连续/同期期间。
logic:
  type: all
  conditions:
  - type: amount_mismatch
    left: 年度.本年净利润
    right: 0
    tolerance: 0
    direction: below
  - type: amount_mismatch
    left: 年度.上年净利润
    right: 0
    tolerance: 0
    direction: below
  - type: amount_mismatch
    left: 年度.前年净利润
    right: 0
    tolerance: 0
    direction: below
  - type: amount_mismatch
    left:
      div:
      - 年度.本年末资产
      - 年度.上年末资产
    right: 1.2
    tolerance: 0
    direction: above
  - type: amount_mismatch
    left:
      div:
      - 年度.上年末资产
      - 年度.前年末资产
    right: 1.2
    tolerance: 0
    direction: above
evidence:
- 年度.本年净利润
- 年度.上年净利润
- 年度.前年净利润
- 年度.本年末资产
- 年度.上年末资产
- 年度.前年末资产
threshold_basis: 连续三年亏损、连续两年资产增长各超过20%为教学组合预警，不是违法认定。
legal_basis:
- 《中华人民共和国会计法》（2024年）第九条、第二十条：核算及报表编制义务；不规定本规则数值阈值。
references:
- https://kjs.mof.gov.cn/zt/kjfxcgc/kjfqw/202408/t20240814_3941788.htm
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
