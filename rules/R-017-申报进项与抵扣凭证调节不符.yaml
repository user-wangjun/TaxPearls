id: R-017
version: '2.0'
name: 申报进项与抵扣凭证调节不符
category: 外部交叉
tax_type: 增值税
severity: medium
description: 申报进项与抵扣凭证调节不符；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 本期确认用途的扣税凭证，含非发票抵扣凭证；不是本期所有购进发票税额总和，调整项按申报进项栏定义核实。
inputs:
  增值税.进项税额: 增值税申报工作表进项税额；同一期申报口径。
  凭证.本期确认抵扣税额: 凭证对应原始报表/明细台账—本期确认抵扣税额；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  凭证.其他抵扣调整: 凭证对应原始报表/明细台账—其他抵扣调整；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。无调整须明确填0，增加为正、减少为负。
logic:
  type: amount_mismatch
  left: 增值税.进项税额
  right:
    add:
    - 凭证.本期确认抵扣税额
    - 凭证.其他抵扣调整
  tolerance: 100
  direction: absolute
evidence:
- 增值税.进项税额
- 凭证.本期确认抵扣税额
- 凭证.其他抵扣调整
threshold_basis: 金额差额容差100元为本项目示意核对参数，不是税法规定的重要性标准；等于容差不命中。
legal_basis:
- 《中华人民共和国增值税法》第十四条、第十六条、第二十一条、第二十八条：一般计税、进项抵扣和纳税义务时间；适用于2026年起。
- 《中华人民共和国税收征收管理法》第二十五条：如实申报义务；差异本身不能认定少缴税。
references:
- https://fgk.chinatax.gov.cn/zcfgk/c100009/c5237365/content.html
- https://12366.chinatax.gov.cn/bzds/120/120-1-4.html
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
