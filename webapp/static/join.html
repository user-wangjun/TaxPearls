<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>接受邀请 · 税海拾珠</title><link rel="stylesheet" href="/member-links.css?v=20261020-members-1"></head>
<body class="tp-join-page"><main class="tp-join-window"><div class="tp-wordmark">税海拾珠 TAXPEARLS</div><h1 id="join-title">正在核验邀请…</h1><p id="join-context" class="tp-institution"></p><p id="join-error" role="alert" aria-live="polite"></p><p id="join-success" role="status" aria-live="polite"></p>
<form id="join-form" hidden><div class="join-line"><button type="button" id="join-new" class="join-primary" aria-pressed="true">注册并加入</button><button type="button" id="join-existing" class="join-secondary" aria-pressed="false">已有账号登录</button></div>
<label for="join-email">邮箱</label><input id="join-email" type="email" autocomplete="email" maxlength="254" required>
<div id="join-new-fields"><label for="join-name">姓名</label><input id="join-name" autocomplete="name" maxlength="100"><div id="join-student-fields" hidden><label for="join-no">学号</label><input id="join-no" maxlength="80" autocomplete="off"></div>
<label for="join-captcha">人机验证码</label><div class="join-line"><input id="join-captcha" maxlength="12" autocomplete="off"><button id="join-captcha-refresh" class="join-secondary" type="button" aria-label="刷新人机验证码"><img id="join-captcha-image" alt="人机验证码"></button></div>
<label for="join-code">邮箱验证码</label><div class="join-line"><input id="join-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="join-send" class="join-secondary" type="button">获取验证码</button></div></div>
<label for="join-password" id="join-password-label">设置密码</label><input id="join-password" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="join-password-rule"><p id="join-password-rule" class="join-note">10–128 位；大写、小写、数字、符号至少三类，不能使用常见弱口令或包含邮箱前缀。</p>
<div id="join-confirm-box"><label for="join-confirm">确认密码</label><input id="join-confirm" type="password" autocomplete="new-password" maxlength="128"></div>
<label class="join-consent"><input id="join-accept" type="checkbox" required><span id="join-consent-text"></span></label><button id="join-submit" type="submit" class="join-primary join-submit">确认加入</button></form><p class="join-note"><a href="/">返回登录</a></p></main><script src="/join.js?v=20261020-members-1"></script></body></html>
