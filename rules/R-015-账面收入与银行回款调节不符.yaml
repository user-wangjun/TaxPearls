id: R-015
version: '2.0'
name: 账面收入与银行回款调节不符
category: 外部交叉
tax_type: 综合
severity: medium
description: 账面收入与银行回款调节不符；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 银行回款经复核调节至本期权责发生制不含税收入，排除借款、内部转账、资本金，并调整往来、预收、现金收入；不得直接将全部银行入账当收入。
inputs:
  营业收入: 科目余额表6001、6051本期贷方发生额，均须提供；不含税、剔除结转等非经营发生额。
  银行.调节后不含税收入: 网银流水逐笔分类+回款至收入调节底稿；已调整借款/投资/内部转账、往来和预收、现金销售、价税分离；必须填底稿编号。
logic:
  type: amount_mismatch
  left: 营业收入
  right: 银行.调节后不含税收入
  tolerance: 100
  direction: absolute
evidence:
- 营业收入
- 银行.调节后不含税收入
threshold_basis: 金额差额容差100元为本项目示意核对参数，不是税法规定的重要性标准；等于容差不命中。
legal_basis:
- 《中华人民共和国会计法》（2024年）第九条、第二十条：核算及报表编制义务；不规定本规则数值阈值。
references:
- https://kjs.mof.gov.cn/zt/kjfxcgc/kjfqw/202408/t20240814_3941788.htm
suggestion: 追查银行逐笔分类及收入调节底稿，分别核对往来变化、含税转不含税和非经营款项。
