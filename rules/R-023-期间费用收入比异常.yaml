id: R-023
version: '2.0'
name: 期间费用收入比异常
category: 指标偏离
tax_type: 综合
severity: medium
description: 期间费用收入比异常；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 同一期累计收入为正；净利息收入可能使财务费用为负，需要结合费用明细解释。
inputs:
  利润表.销售费用: 利润表对应原始报表/明细台账—销售费用；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  利润表.管理费用: 利润表对应原始报表/明细台账—管理费用；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  利润表.财务费用: 利润表对应原始报表/明细台账—财务费用；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  利润表.营业收入: 利润表对应原始报表/明细台账—营业收入；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
logic:
  type: ratio_range
  numerator:
    add:
    - 利润表.销售费用
    - 利润表.管理费用
    - 利润表.财务费用
  denominator: 利润表.营业收入
  min: 0
  max: 0.3
evidence:
- 利润表.销售费用
- 利润表.管理费用
- 利润表.财务费用
- 利润表.营业收入
threshold_basis: 费用收入比0%—30%为教学示意区间，创业期、研发密集企业须另行校准。
legal_basis:
- 《中华人民共和国会计法》（2024年）第九条、第二十条：核算及报表编制义务；不规定本规则数值阈值。
references:
- https://kjs.mof.gov.cn/zt/kjfxcgc/kjfqw/202408/t20240814_3941788.htm
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
