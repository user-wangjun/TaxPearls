id: R-020
version: '2.0'
name: 毛利率同比变动超过阈值
category: 指标偏离
tax_type: 综合
severity: medium
description: 毛利率同比变动超过阈值；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 同长度可比期间，收入均为正；计算毛利率差的绝对值，阈值0.10表示10个百分点，不是10%的相对变动。
inputs:
  利润表.营业收入: 利润表对应原始报表/明细台账—营业收入；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  利润表.营业成本: 利润表对应原始报表/明细台账—营业成本；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  历史.上年同期收入: 历史对应原始报表/明细台账—上年同期收入；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。历史实际起止日期写入口径说明，必须满足规则要求的连续/同期期间。
  历史.上年同期成本: 历史对应原始报表/明细台账—上年同期成本；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。历史实际起止日期写入口径说明，必须满足规则要求的连续/同期期间。
logic:
  type: amount_mismatch
  left:
    div:
    - sub:
      - 利润表.营业收入
      - 利润表.营业成本
    - 利润表.营业收入
  right:
    div:
    - sub:
      - 历史.上年同期收入
      - 历史.上年同期成本
    - 历史.上年同期收入
  tolerance: 0.1
  direction: absolute
evidence:
- 利润表.营业收入
- 利润表.营业成本
- 历史.上年同期收入
- 历史.上年同期成本
threshold_basis: 毛利率变化超过10个百分点为教学预警参数，须按企业历史波动校准。
legal_basis:
- 《中华人民共和国会计法》（2024年）第九条、第二十条：核算及报表编制义务；不规定本规则数值阈值。
references:
- https://kjs.mof.gov.cn/zt/kjfxcgc/kjfqw/202408/t20240814_3941788.htm
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
