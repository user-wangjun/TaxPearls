id: R-021
version: '2.0'
name: 毛利率偏离参考区间
category: 指标偏离
tax_type: 综合
severity: medium
description: 毛利率偏离参考区间；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 收入为正，行业、地区、业务构成、期间与参考区间一致；参考来源未提供则不执行。
inputs:
  利润表.营业收入: 利润表对应原始报表/明细台账—营业收入；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  利润表.营业成本: 利润表对应原始报表/明细台账—营业成本；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  参考.毛利率下限: 同行业同地区同业务构成同期间毛利率参考下限（比例小数），注明来源版本；示意值必须标明仿真。
  参考.毛利率上限: 与下限同一参考基准的毛利率上限（比例小数），注明来源版本。
logic:
  type: ratio_range
  numerator:
    sub:
    - 利润表.营业收入
    - 利润表.营业成本
  denominator: 利润表.营业收入
  min: 参考.毛利率下限
  max: 参考.毛利率上限
evidence:
- 利润表.营业收入
- 利润表.营业成本
- 参考.毛利率下限
- 参考.毛利率上限
threshold_basis: 上下限来自补充指标与其出处；样例10%—50%仅为教学示意。
legal_basis:
- 《中华人民共和国会计法》（2024年）第九条、第二十条：核算及报表编制义务；不规定本规则数值阈值。
references:
- https://kjs.mof.gov.cn/zt/kjfxcgc/kjfqw/202408/t20240814_3941788.htm
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
