id: R-018
version: '2.0'
name: 工资表与个税工资申报差异
category: 外部交叉
tax_type: 个人所得税
severity: medium
description: 工资表与个税工资申报差异；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 同一月份实际支付的税前工资薪金口径；含应申报免税部分的处理须一致，不把计提工资、税后实发额与个税收入直接比较。
inputs:
  薪酬.本期应申报工资薪金: 薪酬对应原始报表/明细台账—本期应申报工资薪金；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  个税.工资薪金申报收入: 个税对应原始报表/明细台账—工资薪金申报收入；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
logic:
  type: amount_mismatch
  left: 薪酬.本期应申报工资薪金
  right: 个税.工资薪金申报收入
  tolerance: 100
  direction: absolute
evidence:
- 薪酬.本期应申报工资薪金
- 个税.工资薪金申报收入
threshold_basis: 金额差额容差100元为本项目示意核对参数，不是税法规定的重要性标准；等于容差不命中。
legal_basis:
- 《中华人民共和国个人所得税法》第九条：扣缴义务；人数或工资差异仅供核对。
- 《中华人民共和国税收征收管理法》第二十五条：如实申报义务；差异本身不能认定少缴税。
references:
- https://www.chinatax.gov.cn/n810219/n810744/n3752930/n3752974/c3970366/content.html
- https://12366.chinatax.gov.cn/bzds/120/120-1-4.html
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
