policies:
- id: GD-DEED-BASE
  name: 广东契税基本税率及征收征用后重新承受优惠
  tax: 契税
  region_scope: 广东省地方规定
  issuer: 广东省人民代表大会常务委员会
  document_number: 第86号公告
  document_date: '2021-07-30'
  effective_from: '2021-09-01'
  effective_to: null
  source_ids:
  - gd-deed
  - gd-revision
  parameters:
  - name: 基本税率
    value: '0.03'
    unit: 小数比率
    source_id: gd-deed
    clause: 决定第一项，公报第49页
    evidence_text: 我省契税适用税率为百分之三
  conditions:
  - 土地、房屋权属所涉计税事项在广东省；核实承受方与权属转移类型
  - 先核对国家规定的减免，再使用地方基本税率
  - 征收/征用后重新承受优惠须有县级以上人民政府征收/征用及补偿资料
  exclusions:
  - 不得给个人住房优惠或法定免税事项一律套3%
  - 未核对国家契税计税依据和特殊优惠时，不将合同总价直接乘3%
  - 因不可抗力住房灭失按面积判断的部分未整理成金额公式
  calculation_notes:
  - 一般公式：经核对的契税计税依据 × 0.03；国家减免优先，计税依据需另核对
  - 征收征用货币补偿情形：重新承受价格未超过补偿时免征，超过时只对超出部分征税
  - 产权调换/土地置换不支付差价免征，支付差价仅对差价征税
  needed_inputs:
  - 权属所在地
  - 权属转移类型
  - 法定计税依据及增值税处理
  - 减免资格
  - 征收征用证明与补偿金额/差价
  version_notes:
  - 旧《广东省契税实施办法》已列入第289号令废止目录，不能继续作当前依据
  - 适用截止未在决定中明确，不表示永远不变
  policy_level: provincial
  applicable_regions:
  - 广东省
- id: GD-PROPERTY-BASE
  name: 广东房产税从价和从租基本计算口径
  tax: 房产税
  region_scope: 广东省地方规定
  issuer: 广东省人民政府
  document_number: 粤府〔1986〕168号；第289号令修订
  document_date: '2021-09-29'
  original_effective_from: '1987-01-01'
  effective_from: '2021-09-29'
  effective_to: null
  source_ids:
  - gd-property
  - gd-revision
  parameters:
  - name: 从价原值减除比例
    value: '0.30'
    unit: 小数比率
    source_id: gd-property
    clause: 第四条，PDF第2页
    evidence_text: 一次减除30%
  - name: 从价年税率
    value: '0.012'
    unit: 小数比率
    source_id: gd-property
    clause: 第五条，PDF第2页
    evidence_text: 税率为1.2%
  - name: 从租基本税率
    value: '0.12'
    unit: 小数比率
    source_id: gd-property
    clause: 第五条，PDF第2页
    evidence_text: 税率为12%
  conditions:
  - 房产在广东所列城市、县城、建制镇、工矿区征税范围内；不是仅凭企业注册地匹配
  - 按第三条核定产权所有人/经营管理人/承典人/代管人/使用人的纳税身份
  - 从价原值须经账簿及税法口径核对；无原值、不实原值由所在地税务机关核定
  - 从租与从价按实际用途、期间分别判断，先检查法定及其他优惠
  exclusions:
  - 不把固定资产净值当房产原值
  - 个人自有自用非营业房产、法定免税和其他特殊出租优惠不得套基本公式
  - 税款按年征收分期缴纳，不能把年税额当月税额
  calculation_notes:
  - 从价全年基本税额 = 核对后的房产原值 × (1-0.30) × 0.012
  - 从租基本税额 = 经核对的对应期间房产租金计税收入 × 0.12；特殊优惠另核
  - 不满全年、用途变化、免租、原值变化的期间划分和其他国家计税依据须另行核对
  needed_inputs:
  - 房产所在地和征税范围
  - 权属与用途
  - 原值及原值构成
  - 租金计税收入
