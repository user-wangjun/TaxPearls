id: R-001
version: '2.0'
name: 账面收入与增值税销售额差异
category: 内部勾稽
tax_type: 增值税
severity: high
description: 账面收入与增值税销售额差异；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 同一主体、同期累计、不含税；仅筛查差异，收入确认时点、视同销售、免税和非应税项目须人工调节。
inputs:
  营业收入: 科目余额表6001、6051本期贷方发生额，均须提供；不含税、剔除结转等非经营发生额。
  增值税.销售额: 增值税申报工作表销售额；同一期不含税合计，含未开票、免税等范围须与账面核对。
logic:
  type: deviation
  left: 营业收入
  right: 增值税.销售额
  threshold: 0.1
evidence:
- 营业收入
- 增值税.销售额
threshold_basis: 相对偏离超过10%为教学预警参数，并非法定阈值；等于阈值不命中。
legal_basis:
- 《中华人民共和国增值税法》第十四条、第十六条、第二十一条、第二十八条：一般计税、进项抵扣和纳税义务时间；适用于2026年起。
- 《中华人民共和国税收征收管理法》第二十五条：如实申报义务；差异本身不能认定少缴税。
references:
- https://fgk.chinatax.gov.cn/zcfgk/c100009/c5237365/content.html
- https://12366.chinatax.gov.cn/bzds/120/120-1-4.html
suggestion: 编制税会收入调节表，核对未开票收入、视同销售和跨期确认；确认申报错误后再办理更正。
