id: R-004
version: '2.0'
name: 个税申报人数与社保人数差异
category: 外部交叉
tax_type: 个人所得税
severity: medium
description: 个税申报人数与社保人数差异；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 同一月份去重人数；入离职、退休返聘、劳务派遣、缴费时点均可导致合理差异，不能据此直接认定虚列工资。
inputs:
  人力.个税申报人数: 自然人电子税务局同一月份工资薪金申报去重人数，含零税额申报。
  人力.社保参保人数: 社保平台相同月份相同主体参保去重人数；剔除主体、时点差异。
logic:
  type: deviation
  left: 人力.个税申报人数
  right: 人力.社保参保人数
  threshold: 0.1
evidence:
- 人力.个税申报人数
- 人力.社保参保人数
threshold_basis: 相对偏离超过10%为教学预警参数，并非法定阈值；等于阈值不命中。
legal_basis:
- 《中华人民共和国个人所得税法》第九条：扣缴义务；人数或工资差异仅供核对。
- 《中华人民共和国社会保险法》第五十八条：参保登记义务；不要求个税与社保人数天然相等。
references:
- https://www.chinatax.gov.cn/n810219/n810744/n3752930/n3752974/c3970366/content.html
- https://www.npc.gov.cn/npc/c2/c10134/201905/t20190522_175815.html
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
