  title: 关于增值税法施行后增值税优惠政策衔接事项的公告
  document_number: 财政部 税务总局公告2026年第10号
  issuer: 财政部、国家税务总局
  source_kind: 正式公告原文
  format: html
  container: TRS_Editor
  required_text:
  - 公告2026年第10号
  - 起征点为月销售额10万元
  - 起征点为季度销售额30万元
  - 每次（日）销售额1000元
  - 除销售、出租不动产或者转让土地使用权之外
