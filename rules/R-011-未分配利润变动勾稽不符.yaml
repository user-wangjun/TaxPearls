id: R-011
version: '2.0'
name: 未分配利润变动勾稽不符
category: 内部勾稽
tax_type: 综合
severity: medium
description: 未分配利润变动勾稽不符；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 同一期同一主体；利润分配不含盈余公积提取；前期差错、会计政策变更等列入带符号其他调整。
inputs:
  权益.期末未分配利润: 权益对应原始报表/明细台账—期末未分配利润；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  权益.期初未分配利润: 权益对应原始报表/明细台账—期初未分配利润；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  利润表.净利润: 利润表对应原始报表/明细台账—净利润；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  权益.本期利润分配: 权益对应原始报表/明细台账—本期利润分配；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  权益.提取盈余公积: 权益对应原始报表/明细台账—提取盈余公积；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  权益.其他调整: 权益变动调节底稿，前期差错/会计政策等对未分配利润增加为正、减少为负；无则明确填0。
logic:
  type: amount_mismatch
  left:
    sub:
    - 权益.期末未分配利润
    - 权益.期初未分配利润
  right:
    add:
    - sub:
      - sub:
        - 利润表.净利润
        - 权益.本期利润分配
      - 权益.提取盈余公积
    - 权益.其他调整
  tolerance: 100
  direction: absolute
evidence:
- 权益.期末未分配利润
- 权益.期初未分配利润
- 利润表.净利润
- 权益.本期利润分配
- 权益.提取盈余公积
- 权益.其他调整
threshold_basis: 金额差额容差100元为本项目示意核对参数，不是税法规定的重要性标准；等于容差不命中。
legal_basis:
- 《中华人民共和国会计法》（2024年）第九条、第二十条：核算及报表编制义务；不规定本规则数值阈值。
references:
- https://kjs.mof.gov.cn/zt/kjfxcgc/kjfqw/202408/t20240814_3941788.htm
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
