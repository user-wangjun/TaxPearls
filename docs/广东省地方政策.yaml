    text: "广东省人民代表大会常务委员会公报 2021.\r\n6\r\n. 48 .\r\n广东省第十三届人民代表大会常务委员会\r\n公 告\r\n（第86号）\r\n《广东省人民代表大会常务委员会关于广东省契税具体适用税率等事项的决定》已由广东省第十三\r\
      \n届人民代表大会常务委员会第三十三次会议于2021年7月30日通过，现予公布，自2021年9月1日起施行。\r\n广东省人民代表大会常务委员会 \r\n2021年7月30日\n. 49 .\r\n广东省人民代表大会常务委员会公报\
      \ 2021.\r\n6\r\n广东省人民代表大会常务委员会\r\n关于广东省契税具体适用税率等事项的决定\r\n（2021年7月30日广东省第十三届人民代表大会常务委员会第三十三次会议通过）\r\n根据《中华人民共和国契税法》第三条、第\r\
      \n七条规定，现对我省契税具体适用税率等事项决\r\n定如下：\r\n一、我省契税适用税率为百分之三。国家有\r\n免征或者减征规定的，从其规定。\r\n二、土地、房屋被县级以上人民政府征收、\r\n征用的，适用以下规定：\r\
      \n（一）选择货币补偿后，重新承受土地、房\r\n屋权属，价格不超过货币补偿的，免征契税；超\r\n出货币补偿的，对超出部分征收契税。\r\n（二）选择房屋产权调换、土地使用权置换，\r\n不支付差价的，免征契税；支付差价的，对差价\r\
      \n部分征收契税。\r\n三、因不可抗力灭失住房，重新承受住房权\r\n属，不超过原面积的，免征契税；超出原面积的，\r\n对超出部分征收契税。\r\n本决定自2021年9月1日起施行。"
