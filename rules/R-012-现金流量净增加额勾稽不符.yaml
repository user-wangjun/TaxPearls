id: R-012
version: '2.0'
name: 现金流量净增加额勾稽不符
category: 内部勾稽
tax_type: 综合
severity: medium
description: 现金流量净增加额勾稽不符；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 现金及现金等价物口径，剔除受限资金，不能直接拿货币资金总额替代；汇率影响单列。
inputs:
  现金.期末现金及等价物: 现金对应原始报表/明细台账—期末现金及等价物；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  现金.期初现金及等价物: 现金对应原始报表/明细台账—期初现金及等价物；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  现金流量表.经营净额: 现金流量表对应原始报表/明细台账—经营净额；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  现金流量表.投资净额: 现金流量表对应原始报表/明细台账—投资净额；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  现金流量表.筹资净额: 现金流量表对应原始报表/明细台账—筹资净额；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  现金流量表.汇率影响: 现金流量表对应原始报表/明细台账—汇率影响；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
logic:
  type: amount_mismatch
  left:
    sub:
    - 现金.期末现金及等价物
    - 现金.期初现金及等价物
  right:
    add:
    - 现金流量表.经营净额
    - 现金流量表.投资净额
    - 现金流量表.筹资净额
    - 现金流量表.汇率影响
  tolerance: 100
  direction: absolute
evidence:
- 现金.期末现金及等价物
- 现金.期初现金及等价物
- 现金流量表.经营净额
- 现金流量表.投资净额
- 现金流量表.筹资净额
- 现金流量表.汇率影响
threshold_basis: 金额差额容差100元为本项目示意核对参数，不是税法规定的重要性标准；等于容差不命中。
legal_basis:
- 《中华人民共和国会计法》（2024年）第九条、第二十条：核算及报表编制义务；不规定本规则数值阈值。
references:
- https://kjs.mof.gov.cn/zt/kjfxcgc/kjfqw/202408/t20240814_3941788.htm
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
