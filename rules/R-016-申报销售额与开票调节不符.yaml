id: R-016
version: '2.0'
name: 申报销售额与开票调节不符
category: 外部交叉
tax_type: 增值税
severity: medium
description: 申报销售额与开票调节不符；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 发票不含税净额含红字；叠加未开票及跨期、免税、视同交易等带符号调节至申报口径，不能以开票额直接代替全部销售额。
inputs:
  增值税.销售额: 增值税申报工作表销售额；同一期不含税合计，含未开票、免税等范围须与账面核对。
  发票.销项净额: 发票对应原始报表/明细台账—销项净额；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  销售.未开票申报额: 销售对应原始报表/明细台账—未开票申报额；同一主体、规则指定期间，金额单位元（比率用小数）；填具体表名、栏次/底稿编号。
  销售.其他调节: 发票到申报销售额调节底稿，增加申报口径为正、减少为负；无则0。
logic:
  type: amount_mismatch
  left: 增值税.销售额
  right:
    add:
    - 发票.销项净额
    - 销售.未开票申报额
    - 销售.其他调节
  tolerance: 100
  direction: absolute
evidence:
- 增值税.销售额
- 发票.销项净额
- 销售.未开票申报额
- 销售.其他调节
threshold_basis: 金额差额容差100元为本项目示意核对参数，不是税法规定的重要性标准；等于容差不命中。
legal_basis:
- 《中华人民共和国增值税法》第十四条、第十六条、第二十一条、第二十八条：一般计税、进项抵扣和纳税义务时间；适用于2026年起。
- 《中华人民共和国税收征收管理法》第二十五条：如实申报义务；差异本身不能认定少缴税。
references:
- https://fgk.chinatax.gov.cn/zcfgk/c100009/c5237365/content.html
- https://12366.chinatax.gov.cn/bzds/120/120-1-4.html
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
