    source_id: vat-2026
    clause: 第一条第（二）项
    evidence_text: 每次（日）销售额1000元
    operator: lt
  conditions:
  - 核实小规模纳税人身份，以及主管税务机关确定的月、季或按次纳税方式
  - 起征点比较使用规定口径的不含税销售额，差额计税按规定扣除后的不含税余额判断
  - 一日多次交易合并按日；自然人的月纳税特殊情形按2026年第4号逐项核对
  - 核实全部/部分放弃免税以及专用发票情况
  exclusions:
