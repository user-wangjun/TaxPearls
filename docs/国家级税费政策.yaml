# 层级按政策制定机关及依据划分，不按转载网站所在地划分。
# 国家级政策不是广东专属优惠；原 region_scope 保留首批广东采集背景。
schema_version: 1
policy_level: national
applicable_regions:
- 全国
checked_as_of: '2026-10-05'
collection_scope: 首批国家级财税政策计算辅助依据（全国适用，含广东；仍须逐项核对条件）
runtime_integration: false
automatic_calculation_enabled: false
review_status: 已核对首批所采原文及计算条件；不是全部政策清单或永久效力认证
limitations:
- 全国规定不是广东专属优惠；地方政策按税收事项/房产所在地匹配，不能仅按公司名称匹配。
- 参数和条件为人工结构化整理；来源正规不代表任意企业可用，缺资格/业务/期间资料不得自动计算。
- effective_to为null表示所采条款未明确截止，不表示永远有效；未来使用需复查修订和废止。
- 公式均为不可执行的说明文本，未修改规则引擎、企业数据、网页或历史报告。
- 此前135行工业统计数据为一次范围误解的采集，不作为本次政策目标完成证据；保留原文件，不删除。
