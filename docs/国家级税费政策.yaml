      销售额＝含税销售额÷（1＋规定征收率）
      四、自2026年1月1日至2027年12月31日，纳税人发生下列应税交易，允许从含税销售额中扣除相关价款后计算销项税额或者应纳税额
      （一）金融机构开展贴现、转贴现业务，以其实际持有票据期间取得的利息收入作为销售额。
      金融机构开展贴现、转贴现业务需要就贴现利息开具发票的，由贴现机构按照票据贴现利息全额向贴现人开具增值税普通发票，转贴现机构按照转贴现利息全额向贴现机构开具增值税普通发票。
      （二）中国证券登记结算有限责任公司按规定提取的证券结算风险基金、收取的证券公司资金交收违约垫付资金利息、结算过程中收取的资金交收违约罚息，允许从含税销售额中扣除。
      （三）融资租赁和融资性售后回租业务。
      1.经国务院行业主管部门批准（含备案）从事融资租赁业务的纳税人，提供融资租赁服务，支付的借款利息（包括外汇借款和人民币借款利息）、发行债券利息和车辆购置税，允许从含税销售额中扣除。
      2.经国务院行业主管部门批准（含备案）从事融资租赁业务的纳税人，提供融资性售后回租服务，对外支付的借款利息（包括外汇借款和人民币借款利息）、发行债券利息，允许从含税销售额（不含本金）中扣除。
      3.纳税人根据2016年4月30日前签订的有形动产融资性售后回租合同，在合同到期前提供的有形动产融资性售后回租服务，可以继续按照有形动产融资租赁服务缴纳增值税。
      继续按照有形动产融资租赁服务缴纳增值税的纳税人，经国务院行业主管部门批准（含备案）从事融资租赁业务的，根据2016年4月30日前签订的有形动产融资性售后回租合同，可以选择以下方法之一计算销项税额或者应纳税额：
      （1）向承租方收取的价款本金，以及对外支付的借款利息（包括外汇借款和人民币借款利息）、发行债券利息，允许从含税销售额中扣除。
      纳税人提供有形动产融资性售后回租服务，计算当期销项税额或者应纳税额时可以扣除的价款本金，为书面合同约定的当期应当收取的本金。无书面合同或者书面合同没有约定的，为当期实际收取的本金。
      （2）支付的借款利息（包括外汇借款和人民币借款利息）、发行债券利息，允许从含税销售额中扣除。
      4.经商务部授权的省级商务主管部门和国家经济技术开发区批准（含备案）的从事融资租赁业务的纳税人，实收资本达到1.7亿元的，从达到标准的当月起按照上述规定执行。
      （四）纳税人提供建筑服务适用简易计税方法计税的，支付的分包款允许从含税销售额中扣除。
      （五）一般纳税人提供劳务派遣服务，代用工单位支付给劳务派遣员工的工资、福利和为其办理的社会保险及住房公积金，允许从含税销售额中扣除。
      劳务派遣服务，是指取得《劳务派遣经营许可证》的劳务派遣公司，为了满足用工单位对于各类灵活用工的需求，将员工派遣至用工单位，接受用工单位管理并为其工作的服务。
      取得《保安服务许可证》的保安服务公司，提供安全保护服务（含武装守护押运服务）比照上述政策执行。
      （六）纳税人提供旅游服务，向旅游服务购买方收取并支付给其他单位或者个人的住宿费、餐饮费、交通费、签证费、门票费和支付给其他接团旅游企业的旅游费用，允许从含税销售额中扣除。
      （七）纳税人转让其2016年4月30日前取得的土地使用权，选择适用简易计税方法计税的，取得该土地使用权的原价允许从含税销售额中扣除。
      （八）一般纳税人销售其2016年4月30日前取得（不含自建）的不动产，选择适用简易计税方法计税的，以及小规模纳税人销售其取得（不含自建）的不动产（不含个人销售购买的住房），该项不动产购置原价或者取得不动产时的作价允许从含税销售额中扣除。
      （九）房地产开发企业销售房地产项目。
      房地产开发企业销售其开发的适用一般计税方法计税的房地产项目，受让土地时向政府部门支付的土地出让金、征地和拆迁补偿费用、土地前期开发费用和土地出让收益（以下统称土地价款），以及在取得土地时向其他单位或个人支付的货币形式拆迁补偿费用，允许从含税销售额中扣除。
      当期允许扣除的土地价款=（当期销售房地产项目建筑面积÷房地产项目可供销售建筑面积）×支付的土地价款
      当期销售房地产项目建筑面积，是指当期进行纳税申报的增值税销售额对应的建筑面积。
      房地产项目可供销售建筑面积，是指房地产项目可以出售的总建筑面积，不包括销售房地产项目时未单独作价结算的配套公共设施的建筑面积。
      房地产开发企业（包括多个房地产开发企业组成的联合体）受让土地向政府部门支付土地价款后，设立项目公司对该受让土地进行开发，同时符合下列条件的，可由项目公司按规定扣除房地产开发企业向政府部门支付的土地价款。
      1.房地产开发企业、项目公司、政府部门三方签订变更协议或补充合同，将土地受让人变更为项目公司；
      2.政府部门出让土地的用途、规划等条件不变的情况下，签署变更协议或补充合同时，土地价款总额不变；
      3.项目公司存续期间的全部股权由受让土地的房地产开发企业持有。
      （十）纳税人开展金银首饰以旧换新业务，旧金银首饰的作价允许从含税销售额中扣除。
      （十一）纳税人按照本公告第四条第三项至第九项规定从含税销售额中扣除的价款，应当取得符合法律、行政法规或者税务总局规定的合法有效凭证留存备查。否则，不得扣除。
      1.适用第四条第五项规定，以工资、福利支付记录，社会保险缴费记录以及住房公积金缴存记录为合法有效凭证。
      2.适用第四条第七、九项规定，向政府支付土地价款的，以省级以上（含省级）财政部门监（印）制的财政票据为合法有效凭证。
      3.适用第四条第七、八项规定，向其他单位或者个人支付的款项，以发票或者法院判决书、裁定书、调解书，以及仲裁裁决书、公证债权文书为合法有效凭证。如因丢失等原因无法提供取得不动产时的发票，以其他能证明契税计税金额的完税凭证等资料为合法有效凭证。
      4.适用第四条第九项规定，向其他单位或个人支付的货币形式拆迁补偿费用，以拆迁协议、拆迁双方支付和取得拆迁补偿费用凭证等能够证明拆迁补偿费用真实性的材料为合法有效凭证。
      5.除本项上述规定外，按以下规定执行。
      （1）支付给境内单位或者个人的款项，以发票或者省级以上（含省级）财政部门监（印）制的财政票据为合法有效凭证。
      （2）支付给境外单位或者个人的款项，以该单位或者个人的签收单据为合法有效凭证，税务机关对签收单据有疑义的，可以要求其提供境外公证机构的确认证明。
      （3）缴纳的税款，以完税凭证为合法有效凭证。
      纳税人取得的上述凭证属于增值税扣税凭证的，其进项税额不得从销项税额中抵扣。
      （十二）纳税人按照第四条第二项至第八项规定从含税销售额中扣除相关价款的，应按以下规定开具发票，否则，不得扣除。
      1.适用第四条第二、三、四、六项规定，从含税销售额中扣除的相关价款，不得开具增值税专用发票，可以开具普通发票。
      2.适用第四条第五、七、八项规定，全部含税销售额和扣除的价款应在同一张发票上分别列明，发票的税额按含税销售额扣除相关价款后计算。
      五、其他增值税优惠项目
      （一）自2026年1月1日至2027年12月31日，一般纳税人提供管道运输服务，对其增值税实际税负超过3%的部分实行增值税即征即退政策。
      增值税实际税负，是指纳税人当期提供管道运输服务实际缴纳的增值税额占纳税人当期提供管道运输服务取得的销售额的比例。
      （二）自2026年1月1日起，一般纳税人购进农产品，取得一般纳税人开具的增值税专用发票或海关进口增值税专用缴款书的，以增值税专用发票或海关进口增值税专用缴款书上注明的增值税额为进项税额；从按照简易计税方法依照3%征收率计算缴纳增值税的小规模纳税人取得增值税专用发票的，以增值税专用发票上注明的金额和9%的扣除率计算进项税额；取得（开具）农产品销售发票或收购发票的，以农产品销售发票或收购发票上注明的农产品买价和9%的扣除率计算进项税额。一般纳税人从农民专业合作社购进的免税农产品，可按9%的扣除率计算进项税额。
      （三）自2026年1月1日至2027年12月31日，药品生产企业销售自产创新药的销售额，为向购买方收取的全部价款，其提供给患者后续免费使用的相同创新药，不属于增值税视同应税交易范围。
      （四）自2026年1月1日起，下列文件中现行有效的增值税优惠政策继续实施。
      1.《财政部 国家税务总局关于软件产品增值税政策的通知》（财税〔2011〕100号）。
      2.《财政部 国家税务总局关于外国驻华使（领）馆及其馆员在华购买货物和服务增值税退税政策的通知》（财税〔2016〕51号）和《财政部 税务总局关于外国驻华使（领）馆及其馆员在华购买货物和服务增值税退税政策有关问题的补充通知》（财税〔2017〕74号）。
      3.《财政部 税务总局关于完善资源综合利用增值税政策的公告》（财政部 税务总局公告2021年第40号）。
      4.《财政部 海关总署 税务总局关于调整风力发电等增值税政策的公告》（财政部 海关总署 税务总局公告2025年第10号）第二条。
      （五）自2026年1月1日至2027年12月31日，下列文件中现行有效的增值税优惠政策继续实施。
      1.《财政部 国家税务总局关于粮食企业增值税征免问题的通知》（财税字〔1999〕198号）和《财政部 国家税务总局关于免征储备大豆增值税政策的通知》（财税〔2014〕38号）。
      2.《财政部 国家税务总局关于退还集成电路企业采购设备增值税期末留抵税额的通知》（财税〔2011〕107号）。
      3.《财政部 国家税务总局关于在部分行业试行农产品增值税进项税额核定扣除办法的通知》（财税〔2012〕38号）和《财政部 国家税务总局关于扩大农产品增值税进项税额核定扣除试点行业范围的通知》（财税〔2013〕57号）。
      4.《财政部 国家税务总局关于促进残疾人就业增值税优惠政策的通知》（财税〔2016〕52号）。
      5.《财政部 税务总局关于明确无偿转让股票等增值税政策的公告》（财政部 税务总局公告2020年第40号）。
      6.《财政部 税务总局关于集成电路企业增值税加计抵减政策的通知》（财税〔2023〕17号）。
      7.《财政部 税务总局关于工业母机企业增值税加计抵减政策的通知》（财税〔2023〕25号）。
      8.《财政部 税务总局 退役军人事务部关于进一步扶持自主就业退役士兵创业就业有关税收政策的公告》（财政部 税务总局 退役军人事务部公告2023年第14号）。
      9.《财政部 税务总局 人力资源社会保障部 农业农村部关于进一步支持重点群体创业就业有关税收政策的公告》（财政部 税务总局 人力资源社会保障部 农业农村部公告2023年第15号）。
      10.《财政部 税务总局关于民用航空发动机和民用飞机税收政策的公告》（财政部 税务总局公告2023年第27号）。
      11.《财政部 税务总局关于继续实施银行业金融机构、金融资产管理公司不良债权以物抵债有关税收政策的公告》（财政部 税务总局公告2023年第35号）。
      12.《财政部 商务部 税务总局关于研发机构采购设备增值税政策的公告》（财政部 商务部 税务总局公告2023年第41号）和《财政部 科技部 民政部 商务部 税务总局关于继续执行上海市浦东新区有关研发机构适用采购设备增值税政策资格认定事项的通知》（财税〔2023〕32号）。
      13.《财政部 税务总局关于先进制造业企业增值税加计抵减政策的公告》（财政部 税务总局公告2023年第43号）。
      14.《财政部 税务总局关于延续实施宣传文化增值税优惠政策的公告》（财政部 税务总局公告2023年第60号）和《财政部 税务总局关于更新宣传文化增值税优惠政策适用名单的公告》（财政部 税务总局公告2024年第11号）。
      15.《财政部 税务总局关于延续实施支持文化企业发展增值税政策的公告》（财政部 税务总局公告2023年第61号）。
      16.《财政部 海关总署 税务总局关于调整风力发电等增值税政策的公告》（财政部 海关总署 税务总局公告2025年第10号）第一条。
      17.《财政部 税务总局关于黄金有关税收政策的公告》（财政部 税务总局公告2025年第11号）。
      （六）《财政部 国家税务总局关于全面推开营业税改征增值税试点的通知》（财税〔2016〕36号）中附件2《营业税改征增值税试点有关事项的规定》“一般纳税人为甲供工程提供的建筑服务，可以选择适用简易计税方法计税”和《财政部 税务总局关于建筑服务等营改增试点政策的通知》（财税〔2017〕58号）“建筑工程总承包单位为房屋建筑的地基与基础、主体结构提供工程服务，建设单位自行采购全部或部分钢材、混凝土、砌体材料、预制构件的，适用简易计税方法计税”的规定自2026年1月1日起停止执行，纳税人在2026年1月1日前已适用简易计税方法的项目，继续按照原政策规定执行。
      六、本公告自2026年1月1日起实施。除本公告和增值税法、增值税法实施条例、《财政部 税务总局关于个人销售住房增值税政策的公告》（财政部 税务总局公告2025年第17号）外，在2025年12月31日前制发文件规定的国内环节增值税优惠政策同时停止执行。
      特此公告。
      财政部  税务总局
      2026年1月30日
