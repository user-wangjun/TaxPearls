id: R-004
name: 个税申报人数与社保参保人数不匹配
category: 外部交叉
tax_type: 个人所得税
severity: medium
description: >
  个人所得税申报的工资薪金人数与社保参保人数存在偏离，可能存在虚列工资、
  账外发放薪酬，或未依法参保。本规则需要企业提供社保参保数据，未提供时标记为「未执行」。
logic:
  type: deviation
  left: 人力.个税申报人数
  right: 人力.社保参保人数
  threshold: 0.10
evidence:
  - 人力.个税申报人数
  - 人力.社保参保人数
legal_basis:
  - 《中华人民共和国个人所得税法》第九条
  - 《中华人民共和国社会保险法》第五十七条、第五十八条
suggestion: >
  核对个税全员全额扣缴申报明细与社保参保人员名单，查明人数差异原因，
  及时补正申报或办理参保。
