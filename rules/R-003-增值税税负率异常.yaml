id: R-003
version: '2.0'
name: 增值税税负率偏离参考区间
category: 指标偏离
tax_type: 增值税
severity: medium
description: 增值税税负率偏离参考区间；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 销售额为正；参考值必须与本企业地区、行业、纳税人身份、期间及分子定义一致。没有可靠基准则不执行。
inputs:
  增值税.应纳税额: 增值税申报工作表应纳税额；税负率分子，须与参考基准定义一致。
  增值税.销售额: 增值税申报工作表销售额；同一期不含税合计，含未开票、免税等范围须与账面核对。
  参考.税负率下限: 本企业地区、行业、纳税人身份和期间匹配的税负率参考下限；来源必须注明发布者/版本或仿真示意；比例小数。
  参考.税负率上限: 与下限同一基准的上限；地区、行业、纳税人身份、适用期写入口径说明；比例小数。
logic:
  type: ratio_range
  numerator: 增值税.应纳税额
  denominator: 增值税.销售额
  min: 参考.税负率下限
  max: 参考.税负率上限
evidence:
- 增值税.应纳税额
- 增值税.销售额
- 参考.税负率下限
- 参考.税负率上限
threshold_basis: 上下限由补充指标显式提供并保留出处；样例1%—4.5%仅为仿真示意，非法定税负标准。
legal_basis:
- 《中华人民共和国税收征收管理法》第二十五条：如实申报义务；差异本身不能认定少缴税。
references:
- https://12366.chinatax.gov.cn/bzds/120/120-1-4.html
suggestion: 按适用范围逐项复核原始报表和调节底稿，解释合理差异；确认数据或申报错误后再更正，并保留复核记录。
