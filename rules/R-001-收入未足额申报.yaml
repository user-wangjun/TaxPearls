id: R-001
name: 收入未足额申报
category: 收入完整性
tax_type: 增值税
severity: high
description: >
  账面确认的营业收入与增值税申报的销售额存在显著差异。两者口径本就应当一致
  （均为不含增值税口径），出现较大偏离通常指向未开票收入未申报、视同销售未确认，
  或申报表填报错误。
logic:
  type: deviation
  left: 营业收入
  right: 增值税.销售额
  threshold: 0.10
evidence:
  - 营业收入
  - 增值税.销售额
legal_basis:
  - 《中华人民共和国增值税法》第三条、第七条
  - 《中华人民共和国税收征收管理法》第二十五条、第六十三条
  - 《中华人民共和国会计法》第九条
suggestion: >
  核查账面收入与申报销售额的差异构成，逐笔比对是否存在未开具发票但已实现的收入、
  应视同销售的业务，以及跨期确认问题。若属已实现收入未申报，应及时更正申报
  并补缴税款及滞纳金。
