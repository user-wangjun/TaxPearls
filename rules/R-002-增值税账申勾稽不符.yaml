id: R-002
version: '2.0'
name: 一般计税应纳税额账申勾稽
category: 内部勾稽
tax_type: 增值税
severity: high
description: 一般计税应纳税额账申勾稽；命中仅表示触发核对条件，不等同于税务违法或补税结论。
scope: 仅一般计税、减征和预缴前税额；抵扣调整必须已核实，不能用销项减进项直接代表全部应纳税额。
inputs:
  账面.销项税额: 科目余额表22210105本期贷方发生额；同一主体同一期一般计税销项。
  账面.进项税额: 科目余额表22210101本期借方发生额；需核实与实际准予抵扣口径差异。
  增值税.期初留抵税额: 上期申报期末留抵结转至本期的可用余额；没有也明确填0。
  账面.抵扣调整: 抵扣勾稽底稿；除本期进项、进项转出、期初留抵外使本期可抵扣额增加的净额，减少填负数；无则0。
  账面.进项转出: 应交增值税进项税额转出明细账，同一期正数表示转出；没有也明确填0。
  增值税.一般计税应纳税额: 申报表一般计税销项减实际抵扣后税额，尚未减征、预缴；不含简易计税及其他应补退项目。
logic:
  type: amount_mismatch
  left:
    max:
    - 0
    - sub:
      - 账面.销项税额
      - max:
        - 0
        - sub:
          - add:
            - 账面.进项税额
            - 增值税.期初留抵税额
            - 账面.抵扣调整
          - 账面.进项转出
  right: 增值税.一般计税应纳税额
  tolerance: 100
  direction: absolute
evidence:
- 账面.销项税额
- 账面.进项税额
- 增值税.期初留抵税额
- 账面.抵扣调整
- 账面.进项转出
- 增值税.一般计税应纳税额
threshold_basis: 金额差额容差100元为本项目示意核对参数，不是税法规定的重要性标准；等于容差不命中。
legal_basis:
- 《中华人民共和国增值税法》第十四条、第十六条、第二十一条、第二十八条：一般计税、进项抵扣和纳税义务时间；适用于2026年起。
- 《中华人民共和国税收征收管理法》第二十五条：如实申报义务；差异本身不能认定少缴税。
references:
- https://fgk.chinatax.gov.cn/zcfgk/c100009/c5237365/content.html
- https://12366.chinatax.gov.cn/bzds/120/120-1-4.html
suggestion: 核对转出、期初留抵、可抵扣调整及申报栏次，区分一般计税、简易计税、减征和预缴。
