id: R-002
name: 增值税账面计提与申报税额勾稽不符
category: 税会勾稽
tax_type: 增值税
severity: high
description: >
  按账面销项税额减账面进项税额计算的应纳税额，与增值税申报表申报的应纳税额
  不一致，表明账面计提与申报数据之间未完成勾稽。
logic:
  type: amount_mismatch
  left: 账面.应纳税额
  right: 增值税.应纳税额
  tolerance: 100.0
evidence:
  - 账面.应纳税额
  - 增值税.应纳税额
legal_basis:
  - 《中华人民共和国增值税法》第八条、第三十六条
  - 《中华人民共和国税收征收管理法》第二十五条
suggestion: >
  复核「应交税费—应交增值税」各明细科目本期发生额与申报表对应栏次，查明差异系
  填报错误、进项税额转出未处理，还是账面计提与申报口径不一致，并作相应调整。
