<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考证备考 · 税海拾珠</title>
<link rel="stylesheet" href="/training-dark.css">
</head>
<body>
<header>
  <h1>税海拾珠 · 考证备考</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <div id="who" class="muted"></div>
    <div id="header-actions" hidden style="display:flex;gap:8px;">
      <button class="small" id="change-pass-btn">修改密码</button>
      <button class="small" id="logout-btn">退出登录</button>
    </div>
  </div>
</header>
<main>
  <section id="login-view" class="card" style="max-width:420px;margin:40px auto;">
    <h2>学生登录</h2>
    <label for="college">院校（选填，学号跨校重复时必填）</label>
    <input id="college" placeholder="如：示例大学">
    <label for="student-no">学号</label>
    <input id="student-no" autocomplete="username">
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password">
    <label style="display:flex;align-items:center;gap:6px;margin-top:12px;">
      <input type="checkbox" id="remember" style="width:auto;"> 保持登录 30 天
    </label>
    <div class="row" style="margin-top:14px;">
      <button class="primary" id="login-btn" style="flex:1;">登录</button>
    </div>
    <div class="error" id="login-error"></div>
  </section>

  <section id="app-view" hidden>
    <div class="card" id="workbench-card">
      <h2>我的备考工作台</h2>
      <div id="wb-body"></div>
    </div>

    <div class="card">
      <h2>我的考证目标</h2>
      <div id="goals"></div>
      <div class="ok" id="goal-msg"></div>
    </div>
    <div class="card" id="pr-card">
      <h2>自主练习</h2>
      <div class="row">
        <div><label>证书范围</label><select id="pr-cert"></select></div>
        <div><label>知识点（选填，不选则整证随机）</label><select id="pr-kp"></select></div>
        <div style="flex:0 0 auto;"><button class="primary" id="start-practice">开始出题</button></div>
      </div>
      <div class="muted" id="pr-hint" style="margin-top:6px;"></div>
      <div class="muted" id="pr-stats" style="margin-top:4px;"></div>
      <div id="pr-kps"></div>
      <div id="pr-open"></div>
      <div id="pr-attempt" style="margin-top:14px;"></div>
      <h2 style="margin-top:18px;">错题重练</h2>
      <div id="pr-wrong"></div>
    </div>

    <div class="card">
      <h2>证书目录</h2>
      <p class="muted" style="margin-top:-6px;">选择要考的证书，设定考试日期后即可开始备考倒计时。</p>
      <div id="certs"></div>
    </div>

    <div class="card" id="profile-card">
      <h2>学习档案与知识库
        <select id="pf-cert" style="width:auto;min-width:200px;"></select>
        <button class="small" id="load-profile">刷新档案</button>
        <button class="small" id="export-profile">导出档案</button>
      </h2>
      <p class="muted" style="margin-top:-6px;">按知识点汇总历次作答、错题、笔记与答疑提问，仅本人可见。掌握程度为确定性规则：未开始 / 初识（1-2 次）/ 巩固中 / 较熟练（≥3 次且正确率≥80% 且最近一次满分）；一次重练答对不代表长期掌握。</p>
      <div id="pf-summary"></div>
      <div id="pf-list"></div>
    </div>

    <div class="card" id="code-card">
      <h2>编程练习</h2>
      <p class="muted" style="margin-top:-6px;">提交 Python 代码，教学演示级沙箱逐用例运行并加权计分（python -I 隔离 + 超时硬杀 + 输出截断；非容器级边界）。同题每 30 秒限一次提交，结果在判题后即时返回。</p>
      <div class="row">
        <div><label>编程题</label><select id="cc-problem"></select></div>
        <div style="flex:0 0 auto;"><button class="primary" id="cc-submit">提交判题</button></div>
      </div>
      <div class="muted" id="cc-problem-info" style="margin-top:6px;"></div>
      <textarea id="cc-code" style="min-height:160px;font-family:ui-monospace,monospace;margin-top:8px;" placeholder="# 在此粘贴或编写 Python 代码&#10;a, b = map(int, input().split())&#10;print(a + b)"></textarea>
      <div id="cc-result" style="margin-top:8px;"></div>
      <div class="muted" id="cc-history" style="margin-top:8px;"></div>
    </div>
  </section>
</main>
<div id="pass-modal" hidden style="position:fixed;inset:0;background:rgba(4,10,20,.6);display:flex;align-items:center;justify-content:center;z-index:50;">
  <div class="card" style="width:340px;margin:0;">
    <h2>修改密码</h2>
    <label for="old-pass">当前密码</label>
    <input id="old-pass" type="password" autocomplete="current-password">
    <label for="new-pass">新密码（至少 8 位）</label>
    <input id="new-pass" type="password" autocomplete="new-password">
    <label for="new-pass2">确认新密码</label>
    <input id="new-pass2" type="password" autocomplete="new-password">
    <div class="row" style="margin-top:14px;">
      <button class="primary" id="save-pass" style="flex:1;">保存并重新登录</button>
      <button id="cancel-pass">取消</button>
    </div>
    <div class="error" id="pass-error"></div>
  </div>
</div>
<script src="/training-portal.js"></script>
</body>
</html>
