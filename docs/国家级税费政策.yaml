  source_status: 2026衔接文件；所采条款期限2026-01-01至2027-12-31
  snapshot:
    retrieved_on: '2026-10-05'
    byte_length: 83286
    response_sha256: 49226fcdaaae93ac89d335d1607e8fa16b6effd6ec0e82fd4bc3e92aa8966390
    article_text_sha256: 7613f360514f2fce72e9781f3ecfdc30694051333a75335abaea31c3d4cd82c0
    text: |-
      财政部 税务总局公告2026年第10号
      为做好《中华人民共和国增值税法》（以下简称增值税法）施行后增值税优惠政策的衔接工作，延续现行制度和做法，现将增值税优惠政策有关事项公告如下：
      一、增值税起征点标准
      自2026年1月1日至2027年12月31日，小规模纳税人发生应税交易，起征点标准如下：
      （一）以一个月为一个计税期间的，起征点为月销售额10万元。以一个季度为一个计税期间的，起征点为季度销售额30万元。
      （二）按次纳税的，起征点为每次（日）销售额1000元。一日内发生多次应税交易的，按日适用起征点标准。
      小规模纳税人发生应税交易，按照规定以扣除相关价款后的余额计算销售额或者允许从含税销售额中扣除相关价款后计算应纳税额的，以扣除相关价款后的不含税余额，适用本条起征点标准。
      二、免征增值税的项目
      （一）自2026年1月1日起，下列项目免征增值税。
      1.农业生产者销售的自产农产品。
      《中华人民共和国增值税法实施条例》（以下简称增值税法实施条例）第二十六条所称从事农业生产，是指直接从事植物的种植、收割和动物的饲养、捕捞；初级农产品，是指《财政部 税务总局关于增值税征税具体范围有关事项的公告》（财政部 税务总局公告2026年第9号）附件1《适用9%增值税税率货物范围注释》中的农产品。
      纳税人销售外购的初级农产品，以及用外购农产品生产、加工的初级农产品，不属于本项目免征增值税的范围，应当按照规定缴纳增值税。
      2.农业机耕、排灌、病虫害防治、植物保护、农牧保险以及相关技术培训业务，家禽、牲畜、水生动物的配种和疾病防治。
      增值税法第二十四条第一款第一项所称农业机耕，是指在农业、林业、畜牧业中使用农业机械进行耕作（包括耕耘、种植、收割、脱粒、植物保护等）的业务；排灌，是指对农田进行灌溉或者排涝的业务；病虫害防治，是指从事农业、林业、畜牧业、渔业的病虫害测报和防治的业务；农牧保险，是指为种植业、养殖业、畜牧业种植和饲养的动植物提供保险的业务；相关技术培训，是指与农业机耕、排灌、病虫害防治、植物保护业务相关以及为使农民获得农牧保险知识的技术培训业务；家禽、牲畜、水生动物的配种和疾病防治，包括与该项服务有关的提供药品和医疗用具的业务。
      3.医疗机构提供的医疗服务。
      增值税法实施条例第二十七条所称医疗机构，具体包括：各级各类医院、门诊部（所）、社区卫生服务中心（站）、急救中心（站）、城乡卫生院、护理院（所）、疗养院、临床检验中心，各级政府及有关部门举办的卫生防疫站（疾病控制中心）、各种专科疾病防治站（所），各级政府举办的妇幼保健所（站）、母婴保健机构、儿童保健机构，各级政府举办的血站（血液中心）等医疗机构，不包括营利性美容医疗机构。
      增值税法第二十四条第一款第二项所称医疗服务，是指医疗机构按照不高于地市级以上医疗保障部门牵头制定的医疗服务价格（包括政府指导价和按照规定由供需双方协商确定的价格等），为就医者提供《全国医疗服务价格项目规范》所列的各项服务，以及医疗机构向社会提供卫生防疫、卫生检疫的服务。
      4.残疾人个人提供的服务。
      增值税法第二十四条第一款第六项所称残疾人个人提供的服务，是指残疾人本人为社会提供的服务。
      5.托儿所、幼儿园提供的育养服务。
      增值税法实施条例第二十九条所称有关收费标准，是指公办托儿所、幼儿园经当地有关部门批准的收费标准，以及民办托儿所、幼儿园实行政府指导价管理或政府设置参考区间的实际收费标准。
      保育费、保育教育费超过规定收费标准的，以及以开办实验班、特色班和兴趣班等名义收取的费用，与入托、入园挂钩的赞助费、支教费等超过规定范围的各种费用，不属于免征增值税的范围。
      6.殡葬服务。
      增值税法第二十四条第一款第七项所称的殡葬服务，是指收费标准由各地价格主管部门会同有关部门核定，或者实行政府指导价管理的遗体接运（含抬尸、消毒）、遗体整容、遗体防腐、遗体存放（含冷藏）、遗体火化、骨灰寄存、吊唁设施设备租赁、墓穴租赁及管理等服务。
      7.学校提供的学历教育服务。
      （1）增值税法第二十四条第一款第八项所称的学历教育，具体包括：
      初等教育：普通小学、成人小学。
      初级中等教育：普通初中、职业初中、成人初中。
      高级中等教育：普通高中、成人高中、中等职业学校（包括普通中专、成人中专、职业高中、技工学校）。
      高等教育：普通本专科、成人本专科、网络本专科、研究生（博士、硕士）、高等教育自学考试、高等教育学历文凭考试。
      （2）增值税法实施条例第三十条所称学校，具体包括：
      普通学校；经地市级以上人民政府或者同级政府的教育行政部门批准成立、国家承认其学员学历的各类学校；经省级及以上人力资源社会保障行政部门批准成立的技工学校、高级技工学校；经省级人民政府批准成立的技师学院。上述学校均包括符合规定的从事学历教育的民办学校，但不包括职业培训机构等国家不承认学历的教育机构。
      （3）提供学历教育服务免征增值税的收入，是指学校为列入规定招生计划的在籍学生提供学历教育服务取得的收入，具体包括：经有关部门审核批准并按规定标准收取的学费、住宿费、课本费、作业本费、考试报名费收入，以及学校食堂提供餐饮服务取得的伙食费收入。除此之外的收入，包括学校以各种名义收取的赞助费、择校费等，不属于免征增值税的范围。
      8.农业生产用地，具体包括：
      （1）将国有农用地出租给农业生产者用于农业生产。
      （2）将土地使用权转让给农业生产者用于农业生产。
      （3）采取转包、出租、互换、转让、入股等方式将承包地流转给农业生产者用于农业生产。
      9.个人从事金融商品转让业务取得的收入。
      10.美国船级社（ABS）在非营利宗旨不变、中国船级社在美国享受同等免税待遇的前提下，在中国境内提供的船检服务。
      11.台湾航运公司、航空公司从事海峡两岸海上直航、空中直航业务在大陆取得的运输收入。
      台湾航运公司，是指取得交通运输部颁发的“台湾海峡两岸间水路运输许可证”且该许可证上注明的公司登记地址在台湾的航运公司。
      台湾航空公司，是指取得中国民用航空局颁发的“经营许可”或者依据《海峡两岸空运协议》和《海峡两岸空运补充协议》规定，批准经营两岸旅客、货物和邮件不定期（包机）运输业务，且公司登记地址在台湾的航空公司。
      12.土地所有者出让土地使用权和土地使用者将土地使用权归还给土地所有者。
      13.县级以上地方人民政府或自然资源行政主管部门出让、转让或收回自然资源使用权（不含土地使用权）。
      14.香港市场投资者（包括单位和个人）买卖股票、基金，具体包括：
      （1）通过深港通买卖深圳证券交易所上市A股取得的收入。
      （2）通过沪港通买卖上海证券交易所上市A股取得的收入。
      （3）通过基金互认买卖内地基金份额取得的收入。
      15.被撤销金融机构以货物、不动产、无形资产、有价证券、票据等财产清偿债务。
      被撤销金融机构，是指经中国人民银行、金融监管总局依法决定撤销的金融机构及其分设于各地的分支机构，包括被依法撤销的商业银行、信托公司、财务公司、金融租赁公司、信用社。除另有规定外，被撤销金融机构所属、附属企业，不享受被撤销金融机构增值税免税政策。
      16.人民银行对金融机构的贷款的利息收入。
      17.外汇管理部门在从事国家外汇储备经营过程中，委托金融机构发放的外汇贷款取得的利息收入。
      18.个人（不含个体工商户中的一般纳税人）销售自建自用住房。
      19.涉及家庭财产分割的个人无偿转让不动产、土地使用权。
      家庭财产分割，包括下列情形：离婚财产分割；无偿赠与配偶、父母、子女、祖父母、外祖父母、孙子女、外孙子女、兄弟姐妹；无偿赠与对其承担直接抚养或者赡养义务的抚养人或者赡养人；房屋产权所有人死亡，法定继承人、遗嘱继承人或者受遗赠人依法取得房屋产权。
      20.执罚部门和单位处置罚没财产收入，且作为罚没收入如数上缴财政的。
      21.下列文件中现行有效的增值税优惠政策。
      （1）《财政部 国家税务总局 外经贸部关于外国政府和国际组织无偿援助项目在华采购物资免征增值税问题的通知》（财税〔2002〕2号）和《财政部 国家税务总局关于外国政府和国际组织无偿援助项目在华采购物资免征增值税的补充通知》（财税〔2005〕13号）。
      （2）《财政部 税务总局关于全国社会保障基金有关投资业务税收政策的通知》（财税〔2018〕94号）。
      （3）《财政部 税务总局关于基本养老保险基金有关投资业务税收政策的通知》（财税〔2018〕95号）。
      （4）《财政部 税务总局 证监会关于交易型开放式基金纳入内地与香港股票市场交易互联互通机制后适用税收政策问题的公告》（财政部 税务总局 证监会公告2022年第24号）。
      （5）《财政部 税务总局关于法律援助补贴有关税收政策的公告》（财政部 税务总局公告2022年第25号）。
      （6）《财政部 税务总局关于国债等债券利息收入增值税政策的公告》（财政部 税务总局公告2025年第4号）。
      （7）《财政部 税务总局关于划转充实社保基金国有股权及现金收益运作管理税收政策的通知》（财税〔2025〕26号）。
      （二）自2026年1月1日至2027年12月31日，下列项目免征增值税。
      1.农业生产资料。
      （1）农膜、滴灌带、滴灌管和有机肥产品。
      （2）饲料产品。具体包括：
      单一大宗饲料。指以一种动物、植物、微生物或矿物质为来源的产品或其副产品。其范围仅限于糠麸、酒糟、鱼粉、饲用鱼油、草饲料及除豆粕以外的菜子粕、棉子粕、向日葵粕、花生粕等粕类产品。
      混合饲料。指由两种以上单一大宗饲料、粮食、粮食副产品及饲料添加剂按照一定比例配置，其中单一大宗饲料、粮食及粮食副产品的掺兑比例不低于95％的饲料。
      配合饲料。指根据不同的饲养对象的不同生长发育阶段的营养需要，将多种饲料原料按饲料配方经工业生产后，形成的能满足饲养动物全部营养需要（除水分外）的饲料。
      复合预混料。指能够按照国家有关饲料产品的标准要求量，全面提供动物饲养相应阶段所需微量元素（4种或以上）、维生素（8种或以上），由微量元素、维生素、氨基酸和非营养性添加剂中任何两类或两类以上的组分与载体或稀释剂按一定比例配置的均匀混合物。
      浓缩饲料。指由蛋白质、复合预混料及矿物质等按一定比例配制的均匀混合物。
      矿物质微量元素舔砖。指以四种以上微量元素、非营养性添加剂和载体为原料，经高压浓缩制成的块状预混物，可供牛、羊等牲畜直接食用的饲料，属于浓缩饲料。
      宠物饲料不属于免征增值税的饲料。
      （3）批发和零售的种子、种苗、农药、农机。农机包括不带动力的手扶拖拉机和三轮农用运输车。
      （4）农民专业合作社销售本社成员生产的初级农产品，属于农业生产者销售的自产农产品。
      农民专业合作社向本社成员销售的农膜、种子、种苗、农药、农机。
      农民专业合作社，是指依法设立和登记的农民专业合作社。
      2.纳税人提供技术转让、技术开发和与之相关的技术咨询、技术服务。
      技术转让、技术开发，是指《财政部 税务总局关于增值税征税具体范围有关事项的公告》（财政部 税务总局公告2026年第9号）附件2《销售服务、无形资产、不动产注释》中的转让“技术”、提供“研发服务”范围内的业务活动。技术咨询，是指就特定技术项目提供可行性论证、技术预测、专题技术调查、分析评价报告等业务活动。与技术转让、技术开发相关的技术咨询、技术服务，是指转让方（或者受托方）根据技术转让或者开发合同的规定，为帮助受让方（或者委托方）掌握所转让（或者委托开发）的技术，而提供的技术咨询、技术服务业务，且这部分技术咨询、技术服务的价款与技术转让或者技术开发的价款应当在同一张发票上开具。
      纳税人申请免征增值税时，须持技术转让、开发的书面合同，到纳税人所在地省级科技、工信主管部门进行认定，并持有关的书面合同和科技、工信主管部门审核意见证明文件报主管税务机关备查。
      3.个人转让著作权。
      4.按照国家规定的收费标准向学生收取的高校学生公寓住宿费收入和高校学生食堂为高校师生提供餐饮服务取得的收入。
      5.家政服务企业由员工制家政服务员提供家政服务取得的收入。
      家政服务企业，是指在企业营业执照的规定经营范围中包括家政服务内容的企业。员工制家政服务员，是指同时符合下列3个条件的家政服务员：
      （1）依法与家政服务企业签订半年及半年以上的劳动合同或者服务协议，且在该企业实际上岗工作。
      （2）家政服务企业为其按月足额缴纳了企业所在地人民政府根据国家政策规定的基本养老保险、基本医疗保险、工伤保险、失业保险等社会保险。对已享受新型农村养老保险和新型农村合作医疗等社会保险或者下岗职工原单位继续为其缴纳社会保险的家政服务员，如果本人书面提出不再缴纳企业所在地人民政府根据国家政策规定的相应的社会保险，并出具其所在乡镇或者原单位开具的已缴纳相关保险的证明，可视同家政服务企业已为其按月足额缴纳了相应的社会保险。
      （3）家政服务企业通过金融机构向其实际支付不低于企业所在地适用的经省级人民政府批准的最低工资标准的工资。
      6.国家助学贷款取得的利息收入。
      7.福利彩票、体育彩票的发行收入。
      8.社会团体收取的会费。
      社会团体，是指依照国家有关法律法规设立或登记并取得《社会团体法人登记证书》的非营利法人。会费，是指社会团体在国家法律法规、政策许可的范围内，依照社团章程的规定，收取的个人会员、单位会员和团体会员的会费。
      9.中国邮政集团有限公司及其所属邮政企业提供的邮政普遍服务和邮政特殊服务。
      10.军队转业干部和随军家属就业。
      （1）从事个体经营的军队转业干部，自办理税务登记事项之日起，其提供的应税服务3年内免征增值税。
      为安置自主择业的军队转业干部就业而新开办的企业，凡安置自主择业的军队转业干部占企业总人数60%（含）以上的，自办理税务登记事项之日起，其提供的应税服务3年内免征增值税。
      享受上述优惠政策的自主择业的军队转业干部必须持有师以上部队颁发的转业证件。
      （2）从事个体经营的随军家属，自办理税务登记事项之日起，其提供的应税服务3年内免征增值税。
      为安置随军家属就业而新开办的企业，自办理税务登记事项之日起，其提供的应税服务3年内免征增值税。
      享受税收优惠政策的企业，随军家属必须占企业总人数的60%（含）以上，并有军（含）以上政治和后勤机关出具的证明。
      随军家属必须有师以上政治机关出具的可以表明其身份的证明。
      按照上述规定，每一名随军家属可以享受一次免税政策。
      11.供残疾人专用的假肢、轮椅、矫型器（包括上肢矫型器、下肢矫型器、脊椎侧弯矫型器）。
      12.粮食和商品储备收入，具体包括：
      （1）销售政府储备食用植物油。
      （2）粮食经营企业经营军队用粮、救灾救济粮、水库移民口粮。
      军队用粮：指凭相关凭证按军供价供应中国人民解放军和中国人民武装警察部队的粮食。
      救灾救济粮：指经县（含）以上人民政府批准，凭相关凭证按规定的销售价格向需救助的灾民供应的粮食。
      水库移民口粮：指经县（含）以上人民政府批准，凭相关凭证按规定的销售价格供应给水库移民的粮食。
      （3）国家商品储备管理单位及其直属企业承担商品储备任务，从中央或者地方财政取得的利息补贴收入和价差补贴收入。国家商品储备管理单位及其直属企业，是指接受中央、省、市、县四级政府有关部门（或者政府指定管理单位）委托，承担粮（含大豆）、食用油、棉、糖、肉、盐（限于中央储备）等6种商品储备任务，并按有关政策收储、销售上述6种储备商品，取得财政储备经费或者补贴的商品储备企业。利息补贴收入，是指国家商品储备管理单位及其直属企业因承担上述商品储备任务从金融机构贷款，并从中央或者地方财政取得的用于偿还贷款利息的贴息收入。价差补贴收入包括销售价差补贴收入和轮换价差补贴收入。销售价差补贴收入，是指按照中央或者地方政府指令销售上述储备商品时，由于销售收入小于库存成本而从中央或者地方财政获得的全额价差补贴收入。轮换价差补贴收入，是指根据要求定期组织政策性储备商品轮换而从中央或者地方财政取得的商品新陈品质价差补贴收入。
      13.纳税人提供的直接或者间接国际货物运输代理服务。
      （1）纳税人提供直接或者间接国际货物运输代理服务，向委托方收取的全部国际货物运输代理服务收入，以及向国际运输承运人支付的国际运输费用，必须通过金融机构进行结算。
      （2）纳税人为大陆与香港、澳门、台湾地区之间的货物运输提供的货物运输代理服务参照国际货物运输代理服务有关规定执行。
      （3）委托方索取发票的，纳税人应当就国际货物运输代理服务收入向委托方全额开具增值税普通发票。
      14.合格境外投资者（QFII）委托境内公司在我国从事证券买卖业务、人民币合格境外机构投资者（RQFII）委托境内公司在我国从事证券买卖业务，以及经中国人民银行认可的境外机构投资银行间本币市场取得的收入。银行间本币市场包括货币市场、债券市场以及衍生品市场。
      15.统借统还业务利息收入。
      统借统还业务利息收入，是指统借统还业务中，企业集团或企业集团中的核心企业以及集团所属财务公司按不高于支付给金融机构的借款利率水平或者支付的债券票面利率水平，向企业集团或者集团内下属单位收取的利息。
      统借方向资金使用单位收取的利息，高于支付给金融机构借款利率水平或者支付的债券票面利率水平的，应全额缴纳增值税。
      统借统还业务，是指：
      （1）企业集团或者企业集团中的核心企业向金融机构借款或对外发行债券取得资金后，将所借资金分拨给下属单位（包括独立核算单位和非独立核算单位，下同），并向下属单位收取用于归还金融机构或债券购买方本息的业务。
      （2）企业集团向金融机构借款或对外发行债券取得资金后，由集团所属财务公司与企业集团或者集团内下属单位签订统借统还贷款合同并分拨资金，并向企业集团或者集团内下属单位收取本息，再转付企业集团，由企业集团统一归还金融机构或债券购买方的业务。
      16.公募证券投资基金（封闭式证券投资基金、开放式证券投资基金）管理人运用基金买卖股票、债券取得的收入。
      17.期货保税交割业务，具体包括：
      （1）经国务院批准对外开放的货物期货品种保税交割业务。
      （2）上海国际能源交易中心股份有限公司的会员和客户通过上海国际能源交易中心股份有限公司交易的原油期货保税交割业务，大连商品交易所的会员和客户通过大连商品交易所交易的铁矿石期货保税交割业务。
      （3）上海期货交易所的会员和客户通过上海期货交易所交易的期货保税交割业务。
      18.金融同业往来利息收入，具体包括：
      （1）金融机构与人民银行所发生的资金往来业务。包括人民银行对一般金融机构贷款，商业银行购买央行票据、与央行开展货币掉期和货币互存，以及人民银行对商业银行的再贴现等业务。
      （2）银行联行往来业务。包括同一银行系统内部不同行、处之间所发生的资金往来业务，境内银行与其境外的总机构、母公司之间的资金往来业务，以及境内银行与其境外的分支机构、全资子公司之间的资金往来业务。
      （3）金融机构间的资金往来业务。是指经人民银行批准，进入全国银行间同业拆借市场的金融机构之间通过全国统一的同业拆借网络进行的短期（一年以下，含一年）无担保资金融通行为。
      （4）金融机构开展同业存款、同业借款、同业代付、买断式买入返售金融商品、质押式买入返售金融商品、同业存单，取得的利息收入。
      同业存款，是指金融机构之间开展的同业资金存入与存出业务，其中资金存入方仅为具有吸收存款资格的金融机构。
      同业借款，是指法律法规赋予此项业务范围的金融机构开展的同业资金借出和借入业务。其中，“法律法规赋予此项业务范围的金融机构”主要是指农村信用社之间以及在金融机构营业执照列示的业务范围中有反映为“向金融机构借款”业务的金融机构。
      同业代付，是指商业银行（受托方）接受金融机构（委托方）的委托向企业客户付款，委托方在约定还款日偿还代付款项本息的资金融通行为。
      买断式买入返售金融商品，是指金融商品持有人（正回购方）将债券等金融商品卖给债券购买方（逆回购方）的同时，交易双方约定在未来某一日期，正回购方再以约定价格从逆回购方买回相等数量同种债券等金融商品的交易行为。
      质押式买入返售金融商品，是指交易双方进行的以债券等金融商品为权利质押的一种短期资金融通行为。
      同业存单，是指银行业存款类金融机构法人在全国银行间市场上发行的记账式定期存款凭证。
      金融机构，是指银行，包括人民银行、商业银行、政策性银行；信用社；证券公司；金融租赁公司、证券基金管理公司、财务公司、信托公司；保险公司；其他经中国人民银行、金融监管总局、中国证监会批准成立且经营金融保险业务的金融机构等。
      19.保险公司开办的一年期以上人身保险产品取得的保费收入。
      一年期以上人身保险，是指保险期间为一年期及以上返还本利的人寿保险、养老年金保险和其他年金保险，以及保险期间为一年期及以上的健康保险。
      人寿保险，是指以人的寿命为保险标的的人身保险。
      养老年金保险，是指以养老保障为目的，以被保险人生存为给付保险金条件，并按约定的时间间隔分期给付生存保险金的人身保险。养老年金保险应当同时符合下列条件：
      （1）保险合同约定给付被保险人生存保险金的年龄不得小于国家规定的退休年龄。
      （2）相邻两次给付的时间间隔不得超过一年。
      其他年金保险，是指养老年金以外的年金保险。
      健康保险，是指以因健康原因导致损失为给付保险金条件的人身保险。
      保险公司开办一年期以上人身保险，在保险监管部门出具备案回执或批复文件前依法取得的保费收入，属于上述规定的保费收入。
      20.纳税人提供再保险服务（境内保险公司向境外保险公司提供的再保险服务除外），实行与原保险服务一致的增值税政策。再保险合同对应多个原保险合同的，所有原保险合同均适用免征增值税政策时，该再保险合同适用免征增值税政策。否则，该再保险合同应按规定缴纳增值税。原保险服务，是指保险分出方与投保人之间直接签订保险合同而建立保险关系的业务活动。
      21.医疗机构接受其他医疗机构委托，按照不高于地市级以上医疗保障部门牵头制定的医疗服务价格（包括政府指导价和按照规定由供需双方协商确定的价格等），提供《全国医疗服务价格项目规范》所列的各项服务，可适用本公告第二条第一项“医疗机构提供的医疗服务”政策。
      22.为了配合国家住房制度改革，企业、行政事业单位按房改成本价、标准价出售住房取得的收入。
      23.住房公积金管理中心用住房公积金在指定的委托银行发放的个人住房贷款取得的利息收入。
      24.黄金生产和经营单位销售黄金（不包括以下品种：牌号为AU9999、AU9995、AU999、AU995，规格为50克、100克、1公斤、3公斤、12.5公斤的黄金，统称标准黄金）和黄金矿砂（含伴生金）。
      25.中国信达资产管理股份有限公司、中国中信金融资产管理股份有限公司、中国长城资产管理股份有限公司和中国东方资产管理股份有限公司及各自经批准分设于各地的分支机构（以下称资产公司），在收购、承接和处置剩余政策性剥离不良资产和改制银行剥离不良资产过程中开展的以下业务：
      （1）接受相关国有银行的不良债权，借款方以货物、不动产、无形资产、有价证券和票据等抵充贷款本息的，资产公司销售、转让该货物、不动产、无形资产、有价证券、票据以及利用该货物、不动产从事的融资租赁业务。
      （2）接受相关国有银行的不良债权取得的利息。
      （3）资产公司所属的投资咨询类公司，为本公司收购、承接、处置不良资产而提供的资产、项目评估和审计服务。
      政策性剥离不良资产，是指资产公司按照国务院规定的范围和额度，以账面价值进行收购的相关国有银行的不良资产。
      处置不良资产，是指资产公司按照有关法律、行政法规，为使不良资产的价值得到实现而采取的债权转移的措施，具体包括运用出售、置换、资产重组、债转股、证券化等方法对贷款及其抵押品进行处置。
      资产公司除收购、承接、处置规定的政策性剥离不良资产和改制银行剥离不良资产业务外，从事其他经营业务应一律依法纳税。
      除另有规定者外，资产公司所属、附属企业，不得享受资产公司免征增值税的政策。
